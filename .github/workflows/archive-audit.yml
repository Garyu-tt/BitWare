name: Archived results audit
on: [push, pull_request]
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: bash -n build.sh
      - run: python3 scripts/verify_results.py
      - run: python3 -m compileall -q r03 r04 scripts
